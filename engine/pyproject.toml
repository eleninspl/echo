[project]
name = "echo-engine"
version = "0.1.0"
description = "Echo engine: finds podcast guests in the audience sweet spot using the Qloo Taste AI API."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pydantic>=2.7",
    "fastapi>=0.161.1",
    "uvicorn[standard]>=0.54.0",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["echo_engine"]

# The Vercel project's root directory is engine/; the function is this app.
[tool.vercel]
entrypoint = "echo_engine.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
